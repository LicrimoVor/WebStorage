server {
    listen 80;
    listen [::]:80;
    server_name s278424.hostiman.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s278424.hostiman.com;
    ssl_certificate /etc/letsencrypt/live/s278424.hostiman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/s278424.hostiman.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WebStorageSSL:10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    root /var/www/html;
    index index.html;
    client_max_body_size 10m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/live {
        proxy_pass http://127.0.0.1:8000;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /sw.js {
        try_files $uri =404;
        expires -1;
    }

    location = /offline.html {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
