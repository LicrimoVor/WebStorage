name: webstorage

services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webstorage}
      POSTGRES_USER: ${POSTGRES_USER:-webstorage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webstorage}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-webstorage} -d ${POSTGRES_DB:-webstorage}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18.1-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: webstorage_test
      POSTGRES_USER: ${POSTGRES_USER:-webstorage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webstorage}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-webstorage} -d webstorage_test",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
