<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="light dark" />
    <title>Нет соединения — Веб-склад</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 440px; text-align: center; }
      h1 { font-size: 26px; line-height: 1.3; }
      button { min-height: 44px; padding: 10px 24px; font: inherit; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет соединения с сервером</h1>
      <p>Проверьте подключение к интернету и попробуйте снова. Для работы со складом требуется сеть.</p>
      <button onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
