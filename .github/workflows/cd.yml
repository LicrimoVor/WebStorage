name: CD

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: webstorage-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Download frontend archive from CI
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}

      - name: Connect to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          ssh production 'sudo -n bash -c "echo Connected"'

      - name: Update repository
        run: |
          ssh production "sudo -n bash -se -- '$GITHUB_REPOSITORY' '$GITHUB_SHA'" <<'REMOTE'
          export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes'
          install -d -m 700 /opt/webstorage
          if [ ! -d /opt/webstorage/repository/.git ]; then
            git clone --branch main "git@github.com:$1.git" /opt/webstorage/repository
          fi
          cd /opt/webstorage/repository
          git diff --exit-code
          git diff --cached --exit-code
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$2" ]; then
            echo 'main has changed; deploy the latest CI run.' >&2
            exit 1
          fi
          git checkout --detach "$2"
          REMOTE

      - name: Start Docker Compose
        run: |
          ssh production 'sudo -n bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/webstorage/repository
          compose() {
            docker compose --project-name webstorage-production \
              --env-file /opt/webstorage/.env \
              --file /opt/webstorage/repository/infra/compose.yml "$@"
          }
          compose config --quiet
          compose build backend
          compose up -d --wait --wait-timeout 120 database
          compose stop backend
          umask 077
          install -d -m 700 /opt/webstorage/backups
          backup="/opt/webstorage/backups/$(date -u +%Y%m%dT%H%M%SZ)-$$.dump"
          compose exec -T database sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$backup.partial"
          mv "$backup.partial" "$backup"
          compose run --rm --no-deps backend alembic upgrade head
          compose up -d --no-deps --force-recreate --wait --wait-timeout 120 backend
          compose ps
          REMOTE

      - name: Update Nginx config
        run: |
          ssh production 'sudo -n bash -se' <<'REMOTE'
          set -o pipefail
          cd /opt/webstorage/repository
          domain=$(docker compose --project-name webstorage-production --env-file /opt/webstorage/.env -f infra/compose.yml config --format json | python3 -c 'import json,re,sys; origin=json.load(sys.stdin)["services"]["backend"]["environment"]["PUBLIC_APP_URL"]; match=re.fullmatch(r"https://([a-zA-Z0-9.-]+)", origin); sys.exit("Invalid PUBLIC_APP_URL") if not match else print(match[1])')
          install -d /etc/nginx/sites-available /etc/nginx/sites-enabled /var/www/html
          sed "s/s278424.hostiman.com/$domain/g" infra/nginx.conf > /etc/nginx/sites-available/webstorage
          chmod 644 /etc/nginx/sites-available/webstorage
          ln -sfn /etc/nginx/sites-available/webstorage /etc/nginx/sites-enabled/webstorage
          nginx -t
          systemctl reload-or-restart nginx
          REMOTE

      - name: Upload and extract frontend archive
        run: |
          ssh production 'sudo -n bash -c "cat > /opt/webstorage/frontend.tar.gz"' < frontend.tar.gz
          ssh production 'sudo -n bash -se' <<'REMOTE'
          staging=$(mktemp -d /opt/webstorage/frontend.XXXXXX)
          trap 'rm -rf -- "$staging" /opt/webstorage/frontend.tar.gz' EXIT
          tar -xzf /opt/webstorage/frontend.tar.gz -C "$staging"
          rsync -rlt --chmod=D755,F644 --exclude=index.html "$staging/" /var/www/html/
          install -m 644 "$staging/index.html" /var/www/html/.webstorage-index
          mv -f /var/www/html/.webstorage-index /var/www/html/index.html
          REMOTE

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
