name: CD

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: webstorage-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Проверка, что ключ читается и соответствует ожидаемому формату
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
      - name: Update server checkout and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash -s -- '$GITHUB_REPOSITORY' '$GITHUB_SHA' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          repository=$1
          revision=$2
          run_id=$3
          [[ "$revision" =~ ^[a-f0-9]{40}$ && "$run_id" =~ ^[0-9]+-[0-9]+$ ]]
          base=/opt/webstorage
          checkout="$base/repository"
          install -d -m 700 "$base"
          exec 9>"$base/deploy.lock"
          flock -w 600 9
          export GIT_TERMINAL_PROMPT=0
          export GIT_SSH_COMMAND='ssh -i /root/.ssh/github_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes'
          if [[ ! -d "$checkout/.git" ]]; then
            git clone --branch main --single-branch "git@github.com:$repository.git" "$checkout"
          fi
          cd "$checkout"
          [[ "$(git remote get-url origin)" == "git@github.com:$repository.git" ]]
          git diff --quiet
          git diff --cached --quiet
          git fetch --prune origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$revision" ]] || {
            echo 'A newer main revision exists; refusing to deploy an outdated commit.' >&2
            exit 1
          }
          git checkout --detach "$revision"
          bash deploy/remote-deploy.sh "$revision-$run_id"
          REMOTE
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
