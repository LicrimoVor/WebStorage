name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        env:
          BACKEND_IMAGE: webstorage-backend:check
        run: docker compose --env-file deploy/production.env.example -f deploy/compose.yml config --quiet
      - run: docker build --tag webstorage-backend:check backend
      - name: Check containers and migrations
        run: |
          set -Eeuo pipefail
          root="$GITHUB_WORKSPACE"
          export BACKEND_IMAGE=${BACKEND_IMAGE:-webstorage-backend:check}
          # Exercise URL encoding, including Alembic's percent interpolation.
          export POSTGRES_PASSWORD='cd-check@%:password'
          compose() {
              docker compose --project-name webstorage-cd-check \
                  --env-file "$root/deploy/production.env.example" \
                  --file "$root/deploy/compose.yml" --file - "$@" <<'OVERRIDE'
          services:
            backend:
              ports: !reset []
          OVERRIDE
          }
          # Only this isolated test project's volumes are removed.
          trap 'compose down --volumes --remove-orphans' EXIT
          compose up -d --wait --wait-timeout 120 database
          compose run --rm --no-deps backend alembic upgrade head
          compose run --rm --no-deps backend alembic check
          compose up -d --wait --wait-timeout 120 backend
          compose exec -T backend python -c '
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          assert os.getuid() != 0
          path = Path("/app/media/.deployment-check")
          path.write_text("ok")
          path.unlink()
          try:
              urllib.request.urlopen("http://127.0.0.1:8000/api/v1/auth/session", timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError("Authentication must be enabled")
          '

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: webstorage_test
          POSTGRES_USER: webstorage
          POSTGRES_PASSWORD: webstorage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstorage -d webstorage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://webstorage:webstorage@localhost:5432/webstorage_test
      TEST_DATABASE_URL: postgresql+asyncpg://webstorage:webstorage@localhost:5432/webstorage_test
      AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_DB: webstorage
          POSTGRES_USER: webstorage
          POSTGRES_PASSWORD: webstorage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstorage -d webstorage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://webstorage:webstorage@localhost:5432/webstorage
      AUTH_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e .
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- backend/openapi.json frontend/src/shared/api/generated/schema.d.ts
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run stylelint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
      - name: Archive frontend
        run: tar -czf frontend.tar.gz -C frontend/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend.tar.gz
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [backend, frontend, deployment-config]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/cd.yml
    secrets: inherit
